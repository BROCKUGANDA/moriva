name: Deploy to VPS

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moriva-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, moriva]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          set -euo pipefail
          docker build -t "moriva-app:${GITHUB_SHA::12}" .
          docker tag "moriva-app:${GITHUB_SHA::12}" moriva-app:current

      - name: Apply stack
        run: |
          set -euo pipefail
          cd deploy
          IMAGE="moriva-app:${GITHUB_SHA::12}" docker compose --env-file /mnt/data/moriva/.env up -d --remove-orphans
          IMAGE="moriva-app:${GITHUB_SHA::12}" docker compose --env-file /mnt/data/moriva/.env ps

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl -fsS -H 'Host: moriva.57.130.80.158.sslip.io' http://127.0.0.1:8086/api/health | grep -q '"status":"ready"'; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "health check failed"
          docker logs moriva-app-1 --tail 120 || true
          exit 1

      - name: Prune old images
        if: success()
        run: docker image prune -f --filter "until=168h" >/dev/null 2>&1 || true
