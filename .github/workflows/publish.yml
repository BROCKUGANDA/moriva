name: Publish image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    # Hosted runners are unavailable on this account (billing lock); the build
    # host already has Docker and can push to GHCR with the workflow token.
    runs-on: [self-hosted, moriva]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/${IMAGE_NAME,,}"
          SHA_TAG="${GITHUB_SHA::12}"
          REF="${GITHUB_REF_NAME}"
          tags=(-t "$IMAGE:sha-$SHA_TAG")
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="${REF#v}"
            MAJOR_MINOR="${VERSION%.*}"
            tags+=(-t "$IMAGE:$VERSION" -t "$IMAGE:$MAJOR_MINOR")
          fi
          tags+=(-t "$IMAGE:latest")
          echo "tags: ${tags[*]}"
          docker build "${tags[@]}" .
          for t in "${tags[@]}"; do
            [[ "$t" == -t ]] && continue
            docker push "$t"
          done
