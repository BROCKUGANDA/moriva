name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: [self-hosted, moriva]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: npx eslint src
      - run: bun run test:unit
      - run: bun run build
        env:
          DATABASE_URL: file:./db/ci.db
          DEMO_MODE: "true"
