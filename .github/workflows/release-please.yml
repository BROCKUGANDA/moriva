name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: [self-hosted, moriva]
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

      # A release created with GITHUB_TOKEN does not emit a `release` event to
      # other workflows, so the publish and deploy pipelines are dispatched
      # explicitly. workflow_dispatch is exempt from that suppression.
      - name: Dispatch publish and deploy
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          dispatch() {
            local wf="$1" ref="$2"
            echo "dispatching $wf @ $ref"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/$wf/dispatches" \
              -d "{\"ref\":\"$ref\"}"
          }
          dispatch publish.yml "${TAG:-main}"
          dispatch deploy.yml main
