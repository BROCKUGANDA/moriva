name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: [self-hosted, moriva]
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
