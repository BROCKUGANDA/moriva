services:
  app:
    image: ${IMAGE:-ghcr.io/BROCKUGANDA/moriva:latest}
    container_name: moriva-app-1
    restart: unless-stopped
    env_file:
      - /mnt/data/moriva/.env
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /mnt/data/moriva/db:/app/db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
