name: moriva

services:
  app:
    image: ${IMAGE:-moriva-app:local}
    container_name: moriva-app-1
    restart: unless-stopped
    env_file:
      - /mnt/data/moriva/.env
    volumes:
      - /mnt/data/moriva/db:/app/db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  edge:
    image: caddy:2-alpine
    container_name: moriva-edge-caddy-1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "127.0.0.1:8086:80"
      - "127.0.0.1:8449:443"
      - "127.0.0.1:8449:443/udp"
    volumes:
      - ./Caddyfile.moriva-edge:/etc/caddy/Caddyfile:ro
      - /mnt/data/moriva/caddy/data:/data
      - /mnt/data/moriva/caddy/config:/config
